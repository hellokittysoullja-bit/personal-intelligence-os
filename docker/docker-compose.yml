services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: pios
      POSTGRES_DB: pios
    ports:
      - "5432:5432"
    volumes:
      - pios_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pios_postgres_data:
