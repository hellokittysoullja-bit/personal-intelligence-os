name: pios

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pios}
    volumes:
      - pios_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-pios}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pios}
    command: ["pnpm", "--filter", "@pios/database", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["operations"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-pios}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pios}
      OWNER_ID: ${OWNER_ID:?set OWNER_ID in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
      PIOS_LLM_BASE_URL: ${PIOS_LLM_BASE_URL:-}
      PIOS_LLM_API_KEY: ${PIOS_LLM_API_KEY:-}
      PIOS_LLM_MODEL: ${PIOS_LLM_MODEL:-}
      PIOS_VERIFIER_MODEL: ${PIOS_VERIFIER_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_PORT: 3002
      WORKER_RECONCILE_INTERVAL_MS: ${WORKER_RECONCILE_INTERVAL_MS:-30000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pios}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pios}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PIOS_API_URL: http://api:3001
      PIOS_API_TOKEN: ${PIOS_API_TOKEN:?set PIOS_API_TOKEN in .env}
      PIOS_WEB_USERNAME: ${PIOS_WEB_USERNAME:?set PIOS_WEB_USERNAME in .env}
      PIOS_WEB_PASSWORD: ${PIOS_WEB_PASSWORD:?set PIOS_WEB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pios_postgres_data:
